name: HouseholdOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild \
            -project HouseholdOS.xcodeproj \
            -scheme HouseholdOS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean test
